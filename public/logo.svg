<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 32" width="100%" height="100%">
  <!--
    ==========================================================================
    LOGOTIPO FIRPLAK EDITABLE
    
    ¿DÓNDE EDITAR EL ESPACIADO ENTRE LETRAS?
    Modifica el valor de 'letter-spacing' abajo:
      - 0.20em  (espaciado sutil)
