      - 0.70em  (ultra expandido)
    ==========================================================================
  -->
  <defs>
    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Montserrat", "Helvetica Neue", Arial, sans-serif;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.48em; /* <-- MODIFICA AQUÍ LA SEPARACIÓN ENTRE LETRAS */
        fill: #ffffff;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <text x="50%" y="22" text-anchor="middle" class="brand-title">FIRPLAK</text>
